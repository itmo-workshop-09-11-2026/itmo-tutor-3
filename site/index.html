<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Магазин настольных игр</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./js/products.js" defer></script>
  <script src="./js/cart.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>
<body>
  <main>
    <header class="shop-header">
      <img src="./assets/shop.svg" width="64" height="64" alt="Вывеска магазина">
      <div>
        <p class="eyebrow">AI-воркшоп · ИТМО</p>
        <h1>Магазин настольных игр</h1>
      </div>
    </header>

    <section id="catalog-section" aria-labelledby="catalog-title">
      <h2 id="catalog-title">Каталог</h2>
      <div id="catalog" class="catalog-grid"></div>
    </section>

    <section id="cart-section" aria-labelledby="cart-title">
      <h2 id="cart-title">Корзина</h2>
      <ul id="cart-items" class="cart-list"></ul>
      <div class="cart-total">
        <span>Итого:</span>
        <span id="cart-total-value">0 ₽</span>
      </div>
    </section>
  </main>
</body>
</html>
